<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <title>Kakao Map Design</title>
    <!-- 디자인에 맞춘 간단한 스타일링 -->
    <style>
        body { margin: 0; padding: 0; background-color: #E6E0D3; } /* 배경색 맞춤 */
        #map { width: 100%; height: 100vh; }
        
        /* 중심 마커 (하트 + 레이블) 스타일 */
        .center-marker { display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .center-heart-marker { width: 44px; height: 44px; background: url('data:image/png;base64,YOUR_BASE64_HEART_IMAGE') no-repeat center center; background-size: cover; display: flex; align-items: center; justify-content: center; }
        .center-label { background: white; border-radius: 12px; padding: 2px 8px; font-size: 10px; margin-top: -6px; box-shadow: 0 1px 2px rgba(0,0,0,0.2); }

        /* 일반 U턴 마커 스타일 */
        .uturn-marker { width: 32px; height: 32px; background: url('data:image/png;base64,YOUR_BASE64_UTURN_IMAGE') no-repeat center center; background-size: cover; border-radius: 50%; box-shadow: 0 1px 2px rgba(0,0,0,0.2); }
        
        /* 주변 정보 마커 스타일 */
        .info-marker { width: 12px; height: 12px; background-color: #7D7D7D; border: 2px solid white; border-radius: 50%; box-shadow: 0 1px 2px rgba(0,0,0,0.3); }
        
    </style>
</head>
<body>
    <div id="map"></div>
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=89ffb7fc95646374f10f4e7b942677ed"></script>
    <script>
        var container = document.getElementById('map');
        var options = {
            center: new kakao.maps.LatLng(36.940, 127.930), // 충주시 대소원면 부근 좌표 예시
            level: 6, // 5km 반경이 다 보이도록 적절한 줌 레벨 조정
            mapTypeId: kakao.maps.MapTypeId.ROADMAP
        };
        var map = new kakao.maps.Map(container, options);
        map.setDraggable(false); // 시안 상 고정된 지도 같으므로 드래그 비활성화

        // 1. 점선 반경 원 (Circle)
        var circle = new kakao.maps.Circle({
            center: options.center, 
            radius: 5000, // 5000m = 5km
            strokeWeight: 2,
            strokeColor: '#C49479', // 시안의 오렌지-브라운 색상
            strokeOpacity: 1,
            strokeStyle: 'dashed', // 점선 스타일
            fillColor: '#FFFFFF', // 시안 상 채워진 색
            fillOpacity: 0 // 시안은 투명하게 채워져 있으므로 0
        });
        circle.setMap(map);

        // 2. 중심 마커 (CustomOverlay - 하트 + 레이블)
        var centerMarkerContent = 
            '<div class="center-marker">' +
            '  <div class="center-heart-marker"></div>' + // 하트 아이콘
            '  <div class="center-label">1998 · 초등학교</div>' + // 레이블
            '</div>';
        var centerOverlay = new kakao.maps.CustomOverlay({
            content: centerMarkerContent,
            map: map,
            position: options.center,
            yAnchor: 1.0, // 마커 아래쪽 끝이 좌표에 위치하도록 조정
            zIndex: 10 // 가장 위에 위치
        });

        // 3. U턴 마커 예시 (CustomOverlay)
        var uturnPoints = [
            new kakao.maps.LatLng(36.942, 127.925),
            new kakao.maps.LatLng(36.938, 127.935)
        ];
        uturnPoints.forEach(pos => {
            new kakao.maps.CustomOverlay({
                content: '<div class="uturn-marker"></div>',
                map: map,
                position: pos,
                yAnchor: 1.0,
                zIndex: 5
            });
        });

        // 4. 주변 정보 마커 예시 (CustomOverlay - 점)
        var infoPoints = [
            new kakao.maps.LatLng(36.945, 127.930),
            new kakao.maps.LatLng(36.935, 127.925),
            new kakao.maps.LatLng(36.936, 127.938),
            new kakao.maps.LatLng(36.943, 127.936),
        ];
        infoPoints.forEach(pos => {
            new kakao.maps.CustomOverlay({
                content: '<div class="info-marker"></div>',
                map: map,
                position: pos,
                zIndex: 1
            });
        });
    </script>
</body>
</html>
